# Vitals: its own entry in the iDrive 8 cluster's widget menu (cluster-render README, "Your own widget").
# Read by cluster-render (0.5.10+) at its next start; on iDrive 8 that is the next head-unit restart.
# A widget: category Ca_Widget_IC, a dynamic widget content of its own (43202001-43205000, never
# 43202020-43202120) and a scene id 0x4d4755...... no other target uses.
id8_targets += vitals
id8_scene_ids_allowed += 0x4d4755000e5b
id8_vitals_category = 43100301
id8_vitals_content = 43204778
id8_vitals_scene_id = 0x4d4755000e5b
id8_vitals_size = 2240x896
id8_vitals_linger_ms = 3000
id8_vitals_description = Vitals
id8_vitals_order = 51
id8_vitals_preview = /var/opt/ida-vitals-cluster/current/preview.png
# black out the cluster's own artwork in the middle behind the widget (the gauges stay)
id8_vitals_background_id = 43400005
id8_vitals_layouts =
id8_vitals_focus = 0
